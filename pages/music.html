<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音乐作品 | 小崔Studio</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">@import "/style.css";</style>
</head>
<body>
  <nav class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md shadow-soft">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="/index.html" class="text-xl font-semibold text-neutral-900">Creator</a>
        <div class="hidden md:flex items-center gap-8">
          <a href="/index.html" class="text-neutral-500 hover:text-primary transition-colors">首页</a>
          <a href="/index.html#about" class="text-neutral-500 hover:text-primary transition-colors">关于我</a>
          <a href="/pages/video.html" class="text-neutral-500 hover:text-primary transition-colors">视频</a>
          <a href="/pages/gallery.html" class="text-neutral-500 hover:text-primary transition-colors">图片</a>
          <a href="/pages/music.html" class="text-primary font-medium">音乐</a>
          <a href="/index.html#ai" class="text-neutral-500 hover:text-primary transition-colors">AI创作</a>
          <a href="/index.html#contact" class="text-neutral-500 hover:text-primary transition-colors">联系</a>
        </div>
      </div>
    </div>
  </nav>

  <section class="pt-40 pb-20 min-h-screen bg-neutral-100">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="text-center mb-16">
        <h2 class="text-3xl font-bold text-neutral-900 mb-3">音乐作品</h2>
        <div class="w-12 h-0.5 bg-primary/60 mx-auto rounded-full"></div>
        <p class="text-neutral-500 mt-6 max-w-xl mx-auto">旋律传递情感，音符编织梦想</p>
      </div>

      <div class="music-grid" id="moduleGrid">
<div class="music-card card-hover">
          <div class="music-cover">
            <div class="music-cover-icon"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
            <div class="music-eq"><span></span><span></span><span></span><span></span></div>
            <button class="music-play-btn" type="button" aria-label="播放">
              <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            </button>
            <div class="music-progress"><div class="music-progress-bar"></div></div>
        <audio preload="metadata" src="https://file.garden/aiKTxQW0TE9uaxk7/music/210.mp3"></audio>
          </div>
          <div class="music-info">
            <div class="music-title">210</div>
            <div class="music-desc"><span>suno</span><span class="music-time">--:--</span></div>
          </div>
        </div>
</div>

      <div class="text-center mt-16">
        <a href="/index.html" class="inline-flex items-center gap-2 px-6 py-2 border border-neutral-200 rounded-md hover:border-primary hover:text-primary transition-colors">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
          <span>返回首页</span>
        </a>
      </div>
    </div>
  </section>

  <footer class="py-10 bg-neutral-900 text-center">
    <p class="text-neutral-400 text-sm">© 2026 小崔Stdio · Power By AI</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
