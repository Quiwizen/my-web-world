  <script>
    // 页面加载完成后执行
    document.addEventListener('DOMContentLoaded', function() {
      // 图片数组
      const images = [
        'https://i.ibb.co/cKTjkmYG/image.jpg',
        'https://i.ibb.co/xq0cW51g/1.jpg',
        'https://i.ibb.co/9mfrJVmZ/3.jpg',
        'https://i.ibb.co/wrwSN4WX/2.jpg',
        'https://i.ibb.co/1fGyWHSV/5.jpg',
        'https://i.ibb.co/5xsFB2LV/4.jpg',
        'https://i.ibb.co/Wvh22rB2/6.jpg',
        'https://i.ibb.co/Xf1jJ4FH/7.jpg',
        'https://i.ibb.co/j9wNh8ks/8.jpg',
        'https://i.ibb.co/G39KYhWN/9.jpg',
        'https://i.ibb.co/C3S0wSJs/11.jpg',
        'https://i.ibb.co/WpkPtrkW/10.jpg',
        'https://i.ibb.co/jv2LNHkn/12.jpg',
        'https://i.ibb.co/mr4GZq28/13.jpg',
        'https://i.ibb.co/TxT2nbDb/14.jpg',
        'https://i.ibb.co/M520FjWD/15.jpg',
        'https://i.ibb.co/nqnBhkTm/16.jpg',
        'https://i.ibb.co/YBkmWxmL/17.jpg',
        'https://i.ibb.co/Y7xk9pwZ/18.jpg',
        'https://i.ibb.co/WWGdPLZ5/19.jpg',
        'https://i.ibb.co/k6r1YBRQ/20.jpg',
        'https://i.ibb.co/YT77zH6H/21.jpg',
        'https://i.ibb.co/7df3B5K6/22.jpg',
        'https://i.ibb.co/LfTyYVb/23.jpg',
        'https://i.ibb.co/b5Hz8ZXb/24.jpg',
        'https://i.ibb.co/604M4pVX/25.jpg',
        'https://i.ibb.co/k6xyTCrn/26.jpg'
      ];

      const mainImage = document.getElementById('mainImage');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const floatPrevBtn = document.getElementById('floatPrevBtn');
      const floatNextBtn = document.getElementById('floatNextBtn');
      const counter = document.getElementById('counter');
      const thumbnailBtns = document.querySelectorAll('.thumbnail-btn');

      let currentIndex = 0;

      function updateImage() {
        mainImage.src = images[currentIndex];
        counter.textContent = (currentIndex + 1) + ' / ' + images.length;
        
        // 更新缩略图选中状态
        thumbnailBtns.forEach(function(btn, index) {
          if (index === currentIndex) {
            btn.classList.add('border-primary');
            btn.classList.remove('border-transparent');
            // 自动滚动到当前选中的缩略图
            btn.scrollIntoView({
              behavior: 'smooth',
              block: 'nearest',
              inline: 'center'
            });
          } else {
            btn.classList.remove('border-primary');
            btn.classList.add('border-transparent');
          }
        });

        // 更新按钮状态
        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === images.length - 1;
        floatPrevBtn.disabled = currentIndex === 0;
        floatNextBtn.disabled = currentIndex === images.length - 1;
      }

      // 下一张
      function goNext() {
        if (currentIndex < images.length - 1) {
          currentIndex++;
          updateImage();
        }
      }

      // 上一张
      function goPrev() {
        if (currentIndex > 0) {
          currentIndex--;
          updateImage();
        }
      }

      // 绑定事件
      prevBtn.addEventListener('click', goPrev);
      nextBtn.addEventListener('click', goNext);
      floatPrevBtn.addEventListener('click', goPrev);
      floatNextBtn.addEventListener('click', goNext);

      // 缩略图点击事件
      thumbnailBtns.forEach(function(btn, index) {
        btn.addEventListener('click', function() {
          currentIndex = index;
          updateImage();
        });
      });

      // 键盘导航
      document.addEventListener('keydown', function(e) {
        // 阻止方向键、Home、End 的默认滚动行为
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
          e.preventDefault();
        }
        
        if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'ArrowUp') {
          goPrev();
        }
        if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'ArrowDown') {
          goNext();
        }
        if (e.key === 'Home') {
          currentIndex = 0;
          updateImage();
        }
        if (e.key === 'End') {
          currentIndex = images.length - 1;
          updateImage();
        }
      });

      // 初始化显示第一张图
      updateImage();
    });
  </script>
