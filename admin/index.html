<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片管理台 · 本地</title>
<style>
  :root{--primary:#4F46E5;--line:#e5e7eb;--bg:#f8fafc;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#0f172a;}
  header{padding:18px 24px;border-bottom:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  header h1{font-size:18px;margin:0;}
  .tabs{display:flex;gap:8px;}
  .tabs button{border:1px solid var(--line);background:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:14px;color:#475569;}
  .tabs button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  main{max-width:1080px;margin:0 auto;padding:24px;display:grid;gap:24px;}
  .batch,.list{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;}
  h2{font-size:15px;margin:0 0 10px;}
  .hint{font-size:12px;color:#64748b;margin:0 0 10px;line-height:1.6;white-space:pre-line;}
  textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical;}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;}
  .btn:hover{background:#f1f5f9;}
  .btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .btn-primary:hover{filter:brightness(1.05);}
  .row{display:flex;gap:10px;margin-top:10px;align-items:center;}
  .list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .card-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff;}
  .card-ops{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .card-ops .idx{font-weight:600;margin-right:4px;}
  .card-ops button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px;}
  .card-ops .del{color:#dc2626;border-color:#fecaca;}
  .field{display:block;margin:6px 0;}
  .field span{display:block;font-size:12px;color:#64748b;margin-bottom:3px;}
  .field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-size:13px;}
  .field textarea{min-height:46px;font-family:ui-monospace,monospace;font-size:12px;}
  .empty{color:#94a3b8;font-size:13px;padding:20px;text-align:center;}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>卡片管理台 · 本地</h1>
  <div class="tabs">
    <button data-mod="music" class="active">音乐 music</button>
    <button data-mod="video">视频 video</button>
  </div>
</header>
<main>
  <section class="batch">
    <h2>批量添加（每行一个，追加到列表末尾）</h2>
    <p class="hint" id="hint"></p>
    <textarea id="batchInput" placeholder="在此粘贴…"></textarea>
    <div class="row">
      <button class="btn btn-primary" id="addBtn">解析并添加</button>
      <button class="btn" id="clearBtn">清空输入</button>
    </div>
  </section>
  <section class="list">
    <div class="list-head">
      <h2>当前卡片（<span id="count">0</span>）— 排序用 ↑ ↓，删除用删除</h2>
      <button class="btn btn-primary" id="saveBtn">保存写回 pages/</button>
    </div>
    <div id="cards"></div>
  </section>
</main>
<div id="toast"></div>
<script>
const FILES = { music:'music.html', video:'video.html' };
const HINTS = {
  music:'每行一个 file.garden 音频链接，例如：\nhttps://file.garden/aiKTxQW0TE9uaxk7/music/210.mp3\n（默认以文件名作标题，可在下方修改）',
  video:'每行一个 B站 iframe 片段或播放器链接，例如：\n<iframe src="//player.bilibili.com/player.html?isOutside=true&bvid=BV1xx&cid=xx&p=1"></iframe>\n或直接贴 https://player.bilibili.com/player.html?...'
};
const MUSIC_ICON = '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>';
const ICON_PLAY = '<svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
const ICON_PAUSE = '<svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>';

let curModule = 'music';
let cards = [];
let dirty = false;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normSrc(s){s=String(s||'');if(s.startsWith('//'))return 'https:'+s;return s;}

function parseRaw(html, module){
  const doc = new DOMParser().parseFromString(html,'text/html');
  const grid = doc.getElementById('moduleGrid');
  if(!grid) return [];
  const out=[];
  for(const el of grid.children){
    if(module==='music'){
      const audio = el.querySelector('audio');
      out.push({
        src: audio?audio.getAttribute('src'):'',
        title: (el.querySelector('.music-title')||{}).textContent||'',
        desc: (el.querySelector('.music-desc span')||{}).textContent||''
      });
    } else {
      const iframe = el.querySelector('iframe');
      out.push({
        src: iframe?iframe.getAttribute('src'):'',
        title: (el.querySelector('h3')||{}).textContent||'',
        placeholder: !!el.querySelector('.video-placeholder')
      });
    }
  }
  return out;
}

function cardHtml(c, module){
  if(module==='music'){
    const has = !!c.src;
    const audio = has?('        <audio preload="metadata" src="'+esc(c.src)+'"></audio>'):'';
    const btn = has?'aria-label="播放"':'title="暂无音频" aria-label="暂无音频" disabled';
    return '        <div class="music-card card-hover">\n'+
      '          <div class="music-cover">\n'+
      '            <div class="music-cover-icon">'+MUSIC_ICON+'</div>\n'+
      '            <div class="music-eq"><span></span><span></span><span></span><span></span></div>\n'+
      '            <button class="music-play-btn" type="button" '+btn+'>\n'+
      '              '+ICON_PLAY+'\n'+'              '+ICON_PAUSE+'\n'+
      '            </button>\n'+
      '            <div class="music-progress"><div class="music-progress-bar"></div></div>\n'+
      audio+'\n'+
      '          </div>\n'+
      '          <div class="music-info">\n'+
      '            <div class="music-title">'+esc(c.title)+'</div>\n'+
      '            <div class="music-desc"><span>'+esc(c.desc||'原创音乐')+'</span><span class="music-time">--:--</span></div>\n'+
      '          </div>\n'+
      '        </div>';
  } else {
    const frame = c.src
      ? '          <div class="video-frame"><iframe src="'+esc(normSrc(c.src))+'" scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true" loading="lazy"></iframe></div>'
      : '          <div class="video-placeholder"><i data-lucide="play-circle" class="w-10 h-10 text-primary/70"></i></div>';
    return '        <div class="rounded-lg overflow-hidden card-hover bg-neutral-100">\n'+
      frame+'\n'+
      '          <div class="p-3">\n'+
      '            <h3 class="text-sm font-medium text-neutral-900 truncate">'+esc(c.title||'视频标题')+'</h3>\n'+
      '          </div>\n'+
      '        </div>';
  }
}

function parseBatch(text, module){
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const line of lines){
    if(module==='music'){
      const name = line.split('/').pop().replace(/\.[^.]+$/,'');
      out.push({src:line, title:name, desc:'原创音乐'});
    } else {
      let src='';
      const m = line.match(/src=["']([^"']+)["']/i);
      if(m) src=m[1];
      else if(/player\.bilibili\.com/.test(line) || line.startsWith('//player')) src=line;
      if(src) out.push({src, title:'视频标题'});
    }
  }
  return out;
}

function render(){
  const wrap = document.getElementById('cards');
  document.getElementById('count').textContent = cards.length;
  if(!cards.length){ wrap.innerHTML='<div class="empty">暂无卡片，使用上方批量添加或在下方编辑</div>'; return; }
  let html='';
  cards.forEach((c,i)=>{
    const isMusic = curModule==='music';
    html+='<div class="card-item" data-i="'+i+'">'+
      '<div class="card-ops"><span class="idx">'+(i+1)+'</span>'+
      '<button data-act="up">↑ 上移</button>'+
      '<button data-act="down">↓ 下移</button>'+
      '<button data-act="del" class="del">删除</button></div>'+
      '<label class="field"><span>标题</span><input class="f-title" data-i="'+i+'" value="'+esc(c.title)+'"></label>'+
      '<label class="field"><span>'+(isMusic?'音频链接':'视频 iframe src')+'</span><textarea class="f-src" data-i="'+i+'">'+esc(c.src)+'</textarea></label>'+
      (isMusic?'<label class="field"><span>描述</span><input class="f-desc" data-i="'+i+'" value="'+esc(c.desc)+'"></label>':'')+
      '</div>';
  });
  wrap.innerHTML=html;
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}

function load(){
  fetch('/api/raw?m='+curModule).then(r=>r.json()).then(d=>{
    if(d.error){toast(d.error);return;}
    cards = parseRaw(d.html, curModule);
    dirty=false;
    render();
  });
}

function save(){
  if(!confirm('将写回 pages/'+FILES[curModule]+'（已自动备份 .bak），确认？')) return;
  const gridHtml = cards.map(c=>cardHtml(c,curModule)).join('\n');
  fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({module:curModule,gridHtml})})
    .then(r=>r.json()).then(d=>{
      if(d.ok){dirty=false;toast('已保存 '+curModule+'（备份 '+d.bak+'）');}
      else toast('保存失败：'+(d.error||'未知'));
    });
}

document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    if(dirty && !confirm('有未保存修改，切换模块将丢失，继续？')) return;
    curModule=b.dataset.mod;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));
    document.getElementById('hint').textContent=HINTS[curModule];
    document.getElementById('batchInput').placeholder = HINTS[curModule];
    load();
  });
});
document.getElementById('addBtn').addEventListener('click',()=>{
  const txt=document.getElementById('batchInput').value;
  const added=parseBatch(txt,curModule);
  if(!added.length){toast('没有解析到可添加的内容');return;}
  cards=cards.concat(added);
  dirty=true;
  render();
  toast('已添加 '+added.length+' 个卡片');
});
document.getElementById('clearBtn').addEventListener('click',()=>{document.getElementById('batchInput').value='';});
document.getElementById('saveBtn').addEventListener('click',save);
document.getElementById('cards').addEventListener('click',e=>{
  const act=e.target.dataset.act; if(!act) return;
  const item=e.target.closest('.card-item'); const i=+item.dataset.i;
  if(act==='del'){cards.splice(i,1);dirty=true;render();toast('已删除');}
  else if(act==='up'&&i>0){[cards[i-1],cards[i]]=[cards[i],cards[i-1]];dirty=true;render();}
  else if(act==='down'&&i<cards.length-1){[cards[i+1],cards[i]]=[cards[i],cards[i+1]];dirty=true;render();}
});
document.getElementById('cards').addEventListener('input',e=>{
  const t=e.target; if(!t.dataset.i) return;
  const i=+t.dataset.i;
  if(t.classList.contains('f-title')) cards[i].title=t.value;
  else if(t.classList.contains('f-src')) cards[i].src=t.value;
  else if(t.classList.contains('f-desc')) cards[i].desc=t.value;
  dirty=true;
});

document.getElementById('hint').textContent=HINTS[curModule];
document.getElementById('batchInput').placeholder=HINTS[curModule];
load();
</script>
</body>
</html>
